<section class="card">
  <h1>Nominee</h1>
  <p style="color:var(--text-2);margin-bottom:var(--sp-5)">
    Nominee details for the policy. If the nominee is under 18, an appointee is required
    (Insurance Act §39) — the appointee block appears automatically.
  </p>

  <div class="grid2">
    <div class="field"><label>Nominee name</label><input class="input" id="n-name" value="{{ nominee.name or '' }}"></div>
    <div class="field"><label>Date of birth</label><input class="input" id="n-dob" placeholder="YYYY-MM-DD" value="{{ nominee.dob or '' }}"></div>
    <div class="field"><label>Relationship</label>
      <select class="input" id="n-rel">
        {% for r in ['Spouse','Son','Daughter','Father','Mother','Brother','Sister','Other'] %}
          <option {{ 'selected' if nominee.relationship == r else '' }}>{{ r }}</option>
        {% endfor %}
      </select></div>
    <div class="field"><label>Share (%)</label><input class="input mono" id="n-share" inputmode="numeric" value="{{ nominee.share_pct or 100 }}"></div>
    <div class="field" style="grid-column:1/-1"><label>Address</label><input class="input" id="n-addr" value="{{ nominee.address or '' }}"></div>
  </div>

  <div id="appointee-block" hidden style="margin-top:var(--sp-4);border-top:1px solid var(--line);padding-top:var(--sp-4)">
    <h2 style="font-size:var(--fs-h2);margin-bottom:var(--sp-3)">Appointee <span class="tag warn">Nominee is a minor · §39</span></h2>
    <div class="grid2">
      <div class="field"><label>Appointee name</label><input class="input" id="a-name" value="{{ nominee.appointee.name if nominee.appointee else '' }}"></div>
      <div class="field"><label>Appointee DOB</label><input class="input" id="a-dob" placeholder="YYYY-MM-DD" value="{{ nominee.appointee.dob if nominee.appointee else '' }}"></div>
      <div class="field"><label>Relationship to nominee</label><input class="input" id="a-rel" value="{{ nominee.appointee.relationship if nominee.appointee else '' }}"></div>
    </div>
  </div>

  <button class="btn btn-primary" id="save-nominee" style="margin-top:var(--sp-4)">Save nominee</button>
  <span class="msg" id="nominee-msg"></span>
  <input type="hidden" id="app-id" value="{{ app.id }}">
</section>
<script src="/journey/static/step6.js"></script>
